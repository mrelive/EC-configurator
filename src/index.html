<!doctype html>
<html lang="en">
    <head>
        <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />

        <script type="module" src="/src/js/utils/common.js"></script>
        <script type="module" src="/src/js/browserMain.ts"></script>

        <title>ECHO CORP FC Configurator</title>
        <meta
            name="description"
            content="Crossplatform configuration and management application for ECHO CORP flight controller workflows."
        />
        <link rel="icon" href="/images/echo_corp_logo_48.png" type="image/png" />
        <link rel="apple-touch-icon" href="/images/pwa/apple-touch-icon.png" sizes="128x128" />
        <meta name="theme-color" content="#06b6d4" />
    </head>
    <body>
        <!-- Every dialog lives in Vue now (see src/components/dialogs). Do not add markup after
             <app></app>: it would be parsed as slot content and dropped, since App.vue has no slot. -->
        <div id="main-wrapper">
            <app></app>
        </div>
        <!-- Teleport target for the phone shell's floating connect control. Vue requires a
             teleport target to exist outside the component tree that renders into it. -->
        <div class="floating-connect"></div>
    </body>
</html>
